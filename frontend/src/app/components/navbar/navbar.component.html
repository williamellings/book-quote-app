<nav class="navbar navbar-expand-lg navbar-custom sticky-top bg-body border-bottom">
  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-gradient-primary" routerLink="/" (click)="closeMenu()">
      <i class="fa-solid fa-book-open-reader fs-4 text-primary"></i>
      <span class="fs-5">Bok & Citat</span>
    </a>

    <!-- Mobile toggle button -->
    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="!isMenuCollapsed"
      aria-label="Växla navigering"
    >
      <i class="fa-solid" [class.fa-bars]="isMenuCollapsed" [class.fa-xmark]="!isMenuCollapsed"></i>
    </button>

    <!-- Navbar links and actions -->
    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <!-- Main Nav Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center">
        <li class="nav-item">
          <a
            class="nav-link px-3 d-flex align-items-center gap-2"
            routerLink="/books"
            routerLinkActive="active fw-semibold text-primary"
            (click)="closeMenu()"
          >
            <i class="fa-solid fa-book text-muted"></i>
            <span>Böcker</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-3 d-flex align-items-center gap-2"
            routerLink="/quotes"
            routerLinkActive="active fw-semibold text-primary"
            (click)="closeMenu()"
          >
            <i class="fa-solid fa-quote-left text-muted"></i>
            <span>Mina citat</span>
          </a>
        </li>
        @if (authService.isLoggedIn()) {
          <li class="nav-item ms-lg-2 my-2 my-lg-0">
            <a
              class="btn btn-sm btn-primary-gradient rounded-pill px-3 d-inline-flex align-items-center gap-2"
              routerLink="/books/new"
              (click)="closeMenu()"
            >
              <i class="fa-solid fa-plus"></i>
              <span>Ny bok</span>
            </a>
          </li>
        }
      </ul>

      <!-- Right Side: Theme Switch & User Actions -->
      <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2 pt-2 pt-lg-0 border-top border-lg-0">
        <!-- Theme Toggle Button -->
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-2 justify-content-center"
          (click)="themeService.toggleTheme()"
          [title]="themeService.currentTheme() === 'light' ? 'Växla till mörkt läge' : 'Växla till ljust läge'"
        >
          @if (themeService.currentTheme() === 'light') {
            <i class="fa-solid fa-moon text-warning"></i>
            <span>Mörkt tema</span>
          } @else {
            <i class="fa-solid fa-sun text-warning"></i>
            <span>Ljust tema</span>
          }
        </button>

        @if (authService.isLoggedIn()) {
          <!-- User Profile and Logout -->
          <div class="d-flex align-items-center gap-2 justify-content-between">
            <span class="badge bg-secondary-subtle text-secondary-emphasis rounded-pill px-3 py-2 d-flex align-items-center gap-2">
              <i class="fa-solid fa-circle-user text-primary fs-6"></i>
              <span class="fw-medium">{{ authService.currentUser()?.username }}</span>
            </span>

            <button
              type="button"
              class="btn btn-sm btn-outline-danger rounded-pill px-3 d-flex align-items-center gap-2"
              (click)="onLogout()"
            >
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Logga ut</span>
            </button>
          </div>
        } @else {
          <!-- Login & Register Links -->
          <div class="d-flex align-items-center gap-2">
            <a
              routerLink="/login"
              class="btn btn-sm btn-outline-primary rounded-pill px-3 d-flex align-items-center gap-2"
              (click)="closeMenu()"
            >
              <i class="fa-solid fa-right-to-bracket"></i>
              <span>Logga in</span>
            </a>
            <a
              routerLink="/register"
              class="btn btn-sm btn-primary rounded-pill px-3 d-flex align-items-center gap-2"
              (click)="closeMenu()"
            >
              <i class="fa-solid fa-user-plus"></i>
              <span>Registrera</span>
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
